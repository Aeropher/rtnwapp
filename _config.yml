# GitHub Pages Configuration
title: RightNow Blog
description: Capacity-first task planning — updates and notes from development.
url: https://blog.rtnw.app
baseurl: ""
author: Alex

# Build settings
markdown: kramdown
theme: null  # We're using custom HTML/CSS + our own layouts
permalink: /blog/:title/

# User guides: one page per thing you can create, change or delete in the app
collections:
  docs:
    output: true
    permalink: /docs/:name/

defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: doc

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Serve the generated feed at /rss.xml so existing links keep working
feed:
  path: rss.xml

# Exclude non-site files from the build
exclude:
  - README.md
  - CLAUDE.md
  - FEATURES.md
  - terms-of-service.md
  - .gitignore
  - .claude/
  - Gemfile
  - Gemfile.lock
  - vendor
  - info/
  - sync-crossposts.js
  - DECISIONS.md
  - VIDEO-PLAN.md

# GitHub Pages will serve index.html by default
