---
layout: default
---
<div class="wrap">
  <article class="prose">
    <a href="{{ '/blog.html' | relative_url }}" class="back-link">← Back to Blog</a>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </div>
    <h1>{{ page.title }}</h1>
    {{ content }}
    {% include newsletter-signup.html %}
    <p class="post-tester-note">On Android? RightNow is in a closed test on Play and
      needs twelve people in it — <a href="{{ '/test.html' | relative_url }}">join the test</a>.</p>
  </article>
</div>
