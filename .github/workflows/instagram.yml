# Posts the next Instagram day from instagram/ once a day, then commits posted.json so
# the same day is never posted twice. Off until the repo variable INSTAGRAM_ENABLED is
# "true"; needs the secrets IG_USER_ID and IG_ACCESS_TOKEN. Run it by hand from the
# Actions tab to post the next day straight away.

name: Post to Instagram

on:
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC: 6pm in winter, 7pm in summer (GitHub may run it late)
  workflow_dispatch:
    inputs:
      count:
        description: How many posts to put out now (e.g. 9 to seed the grid)
        default: '1'

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    if: vars.INSTAGRAM_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Posts one at a time, oldest first; each run of post-next.js records itself in
      # posted.json, so a failure part-way keeps what already went out
      - name: Post the next day
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          COUNT: ${{ inputs.count || '1' }}
        run: |
          for i in $(seq 1 "$COUNT"); do
            node instagram/post-next.js
            if [ "$i" -lt "$COUNT" ]; then sleep 30; fi
          done

      - name: Record it
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "instagram: record today's post"
          git push
