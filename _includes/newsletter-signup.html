<!-- Newsletter signup: posts straight to Buttondown, no JavaScript needed. -->
<div class="newsletter-signup">
  <h3>Get updates by email</h3>
  <p>Occasional posts about building RightNow. No spam, unsubscribe any time.</p>
  <form
    action="https://buttondown.com/api/emails/embed-subscribe/Aeropher"
    method="post"
  >
    <label for="bd-email" style="position:absolute;left:-9999px">Email address</label>
    <input type="email" name="email" id="bd-email" placeholder="you@example.com" required />
    <input type="hidden" value="1" name="embed" />
    <button type="submit">Subscribe</button>
  </form>
  <p style="font-size:0.8em;opacity:0.7">
    You'll get a confirmation email first (double opt-in). Delivered by
    <a href="https://buttondown.com" rel="noopener">Buttondown</a>.
  </p>
</div>
